spring.application.name=coffee-tracker-api

# === DataSource (PostgreSQL) ===
# Copie este arquivo para src/main/resources/application.properties e preencha credenciais.
# Exemplo de URL Neon com SSL:
# spring.datasource.url=jdbc:postgresql://<host>:5432/<database>?sslmode=require&channel_binding=require
# DEV 
# spring.datasource.url=jdbc:postgresql://ep-steep-mountain-acx6seqe-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
# PROD 
spring.datasource.url=jdbc:postgresql://ep-sparkling-wind-ac7feq0u-pooler.sa-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_Oab7fyhzJS3N
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA / Hibernate ===
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Dialect pode ser omitido no Boot 3, deixado aqui apenas como referência
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === Flyway ===
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# === JWT ===
# Gere um segredo forte (>=256 bits). Pode usar Base64.
# Exemplo de geração (Linux/Mac): `openssl rand -base64 48`
app.jwt.secret=COLOQUE_AQUI_UM_SEGREDO_BASE64
app.jwt.expiration=3600000

# === Security ===
spring.security.filter.dispatcher-types=REQUEST,ERROR

# === Jackson / Timezone ===
spring.jackson.time-zone=UTC
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS=false
